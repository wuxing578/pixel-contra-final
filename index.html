let bgmNodes=[],bgmPlaying=false;
const BGM_NOTES=[110,138,165,110,138,165,196,165];
const BGM_BOSS=[220,196,220,246,220,196,175,196];
function startBGM(boss){
stopBGM();
if(!musicOn)return;
const ac=getAC();if(!ac)return;
bgmPlaying=true;
const notes=boss?BGM_BOSS:BGM_NOTES;
const bpm=boss?160:130;
const step=60/bpm;
notes.forEach((freq,i)=>{
const o=ac.createOscillator(),g=ac.createGain();
o.connect(g);g.connect(ac.destination);
o.type='square';o.frequency.value=freq;
const t=ac.currentTime+i*step;
g.gain.setValueAtTime(0,t);
g.gain.linearRampToValueAtTime(0.04,t+0.01);
g.gain.linearRampToValueAtTime(0.02,t+step*0.7);
g.gain.linearRampToValueAtTime(0,t+step*0.95);
o.start(t);o.stop(t+step);
bgmNodes.push(o);
});
[0,2,4,6].forEach(i=>{
const o=ac.createOscillator(),g=ac.createGain();
o.connect(g);g.connect(ac.destination);
o.type='sine';o.frequency.setValueAtTime(80,ac.currentTime+i*step);
o.frequency.exponentialRampToValueAtTime(40,ac.currentTime+i*step+0.08);
const t=ac.currentTime+i*step;
g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
o.start(t);o.stop(t+0.15);
bgmNodes.push(o);
});
bgmNodes._timer=setTimeout(()=>{if(bgmPlaying)startBGM(boss);},notes.length*step*1000);
}
function stopBGM(){
bgmPlaying=false;
clearTimeout(bgmNodes._timer);
bgmNodes.forEach(o=>{try{o.stop();}catch(e){}});

 return {stageName:'第 '+n+' 关 · '+STAGE_WORDS[wi]+STAGE_SUFFIX[si],bossName:BOSS_ALIAS[ai]+'·'+BOSS_TITLES[bi]+' '+String(n).padStart(2,'0')};
}
function enhanceEnemy(e,n){
 const tier=stageTier(n),diff=DIFFS[currentDifficulty].enemy;
 e.maxHp=Math.max(e.maxHp||1,Math.ceil((e.maxHp||e.hp||1)*(1+tier*0.38+dangerLevel(stage)*0.36)*dailyEnemyBonus()));e.hp=e.maxHp;e.vx*=1+dangerLevel(stage)*0.075;if((e.stealth||e.teleportCd!==undefined||e.summoner)&&!e.tipShown){e.tipShown=true;setTimeout(()=>stageNotice(e.stealth?'发现隐身敌人':e.teleportCd!==undefined?'发现瞬移敌人':'发现召唤敌人','#ff88ff'),900);}
 if(e.kind!=='turret')e.vx=(e.vx||0)*(1+Math.min(0.5,tier*0.06));
 if(n>=4)e.armor=Math.min(14,Math.floor((n-1)/2)+dangerLevel(n)*2);
 if(n>=6&&Math.random()<Math.min(0.48,0.10+tier*0.045))e.stealth=true;
 if(n>=8&&e.kind!=='turret'&&Math.random()<Math.min(0.42,0.08+tier*0.04))e.teleportCd=120+Math.floor(Math.random()*180);
 if(n>=10&&e.kind==='soldier'&&Math.random()<Math.min(0.32,0.06+tier*0.03))e.summoner=true;
 if(e.armor)e.hp=e.maxHp=Math.ceil(e.maxHp+e.armor*diff);
}

drawPlayer();drawBossBreakEffects();drawComboTexts();drawBossIntro();drawBossArrow();drawStageOverlay();
ctx.restore();
drawStageCountdown();
raf=requestAnimationFrame(loop);return;
}
if(!stageResult){
mobileStepAcc+=getGameSpeed();
if(mobileStepAcc>=1){
mobileStepAcc-=1;
updatePlayer();
enemies.forEach(e=>updateAI(e));
if(bossActive)updateBoss();
updateBullets();updateDrops();updateCoinParticles();updateDeathAnims();
}
}
ctx.save();ctx.translate(Math.round(shx),Math.round(shy));
drawBG();drawPlatforms();drawCheckpoints();
drops.forEach(drawDrop);drawChests();enemies.forEach(drawEnemy);
drawBoss();drawBullets();drawExplosions();drawParticles();drawCoinParticles();drawDeathAnims();
drawPlayer();drawBossBreakEffects();drawComboTexts();drawBossIntro();drawBossArrow();drawStageOverlay();
ctx.restore();
if(stageResult){srTimer--;drawStageResult();if(srTimer<=0)nextStage();}
raf=requestAnimationFrame(loop);
}
function getCanvasPoint(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height};}
function activateGameOverButton(id){if(id==='restart'){score=0;lives=currentLifeMax();stage=1;beginGame(false);}else if(id==='revive'){normalizeProfile();if(profile.revives<=0){alert('复活币不足，可在商店购买');return;}profile.revives--;saveProfile();showGameOver=false;gameOver=false;running=true;const rx=player?player.checkpointX:60,ry=player?player.checkpointY:GROUND_Y-30;player=mkPlayer(rx,ry);lives=currentLifeMax();player.invincible=210;player.hitFlash=30;player.gunType=2;player.gunTimer=Math.max(player.gunTimer,240);if(profile.reviveClear>0){profile.reviveClear--;bullets=bullets.filter(b=>!b.enemy);enemies.forEach(e=>{if(!e.dead&&Math.abs(e.x-player.x)<340){e.hp-=2;if(e.hp<=0)e.dead=true;}});saveProfile();}else bullets=bullets.filter(b=>!b.enemy);hitCount=0;combo=0;comboEl.textContent=0;mobileStepAcc=0;camShake=0;boom(player.x+player.w/2,player.y+player.h/2,'#44ff88',18,false);comboTexts.push({x:player.x+player.w/2,y:player.y-36,text:'满血复活 · 保护启动',c:'#44ff88',life:2.4});updateHUD();if(boss&&!boss.dead){bossHudWrap.style.display='block';positionBossHud();updateBossHud();startBGM(true);}beginStageCountdown('复活继续');restartLoop();}else if(id==='menu'){showGameOver=false;showMenu=true;running=false;gameOver=false;stopBGM();updateControlLabels();restartLoop();}}
function handleCanvasAction(e){const p=getCanvasPoint(e);if(showShop){const idx=Math.floor((p.y-162)/44);if(idx>=0&&idx<6&&p.x>=W/2-244&&p.x<=W/2+244){e.preventDefault();shopCursor=idx;buyShop(idx);}return;}if(!showGameOver)return;const btn=gameOverButtons.find(b=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h);if(btn){e.preventDefault();activateGameOverButton(btn.id);}}
cv.addEventListener('click',handleCanvasAction);
cv.addEventListener('touchstart',handleCanvasAction,{passive:false});
function rankAreaHit(p){return p.x>=W/2-188&&p.x<=W/2+188&&p.y>=H/2-5&&p.y<=H/2+103;}
function scrollLeaderboard(delta){if(!showGameOver||!leaderboard||leaderboard.length<=6)return;leaderScroll=Math.max(0,Math.min(leaderScroll+delta,leaderboard.length-6));restartLoop();}
cv.addEventListener('wheel',e=>{if(!showGameOver)return;const p=getCanvasPoint(e);if(rankAreaHit(p)){e.preventDefault();scrollLeaderboard(e.deltaY>0?1:-1);}}, {passive:false});
cv.addEventListener('touchstart',e=>{if(!showGameOver)return;const p=getCanvasPoint(e);rankTouchY=rankAreaHit(p)?p.y:null;}, {passive:false});
cv.addEventListener('touchmove',e=>{if(!showGameOver||rankTouchY===null)return;const p=getCanvasPoint(e),dy=p.y-rankTouchY;if(Math.abs(dy)>=12){e.preventDefault();scrollLeaderboard(dy<0?1:-1);rankTouchY=p.y;}}, {passive:false});
cv.addEventListener('touchend',()=>{rankTouchY=null;});
function handleInputPress(key){
if(stageResult){srTimer=0;nextStage();return;}
if(key==='f'||key==='F'){fullBtn.click();return;}
if(key==='e'||key==='E'){autoBtn.click();return;}
if(key==='b'||key==='B'){musicBtn.click();return;}
if(key==='n'||key==='N'){sfxBtn.click();return;}
if(key==='o'||key==='O'){settingsBtn.click();return;}
if((key==='c'||key==='C')&&showMenu){document.getElementById('clearBtn').click();return;}
if(key==='Escape'&&showGameOver){activateGameOverButton('menu');return;}
if((key==='m'||key==='M')&&showGameOver){activateGameOverButton('restart');return;}
if(showShop){if(key==='r'||key==='R'){profile.registered=false;ensureAccount();return;}if(key==='Jump'||key==='ArrowLeft'||key==='a'||key==='A'||key==='ArrowRight'||key==='d'||key==='D'){showShop=false;sfxMenuMove();return;}if(key==='ArrowUp'||key==='w'||key==='W'){shopCursor=(shopCursor+5)%6;sfxMenuMove();return;}if(key==='ArrowDown'||key==='s'||key==='S'){shopCursor=(shopCursor+1)%6;sfxMenuMove();return;}if(key==='Enter'||key==='j'||key==='J'||key==='z'||key==='Z'){buyShop(shopCursor);return;}if(['1','2','3','4','5','6'].includes(key)){shopCursor=Number(key)-1;buyShop(shopCursor);return;}}

if(showTasks&&(key==='Enter'||key==='j'||key==='J'||key==='z'||key==='Z')){claimDaily();return;}
if((key==='m'||key==='M')&&!showGameOver){sb.click();return;}
if((key==='p'||key==='P')&&running&&!showGameOver&&!showMenu&&!stageResult){
paused=!paused;
pauseDiv.style.display=paused?'flex':'none';
if(!paused){getAC();restartLoop();}
}
if(showMenu){
if(showHelp){showHelp=false;return;}
if(showShop){showShop=false;return;}
if(showTasks){showTasks=false;return;}
if(showRecords){showRecords=false;return;}
if(key==='ArrowUp'||key==='w'||key==='W'){menuCursor=(menuCursor-1+MENU_ITEMS.length)%MENU_ITEMS.length;sfxMenuMove();}
if(key==='ArrowDown'||key==='s'||key==='S'){menuCursor=(menuCursor+1)%MENU_ITEMS.length;sfxMenuMove();}
if((key==='ArrowLeft'||key==='a'||key==='A'||key==='ArrowRight'||key==='d'||key==='D')&&menuCursor===2){currentDifficulty=(currentDifficulty+(key==='ArrowLeft'||key==='a'||key==='A'?-1:1)+DIFFS.length)%DIFFS.length;MENU_ITEMS[2]='难度: '+DIFFS[currentDifficulty].name;sfxMenuMove();}
if(key==='Enter'||key==='j'||key==='J'||key==='z'||key==='Z'){
sfxMenuConfirm();
if(menuCursor===0){score=0;lives=currentLifeMax();stage=1;beginGame(false);}
else if(menuCursor===1){beginGame(true);}
else if(menuCursor===2){currentDifficulty=(currentDifficulty+1)%DIFFS.length;MENU_ITEMS[2]='难度: '+DIFFS[currentDifficulty].name;}
else if(menuCursor===3){ensureAccount();shopCursor=0;showShop=true;}
else if(menuCursor===4){showTasks=true;}
else if(menuCursor===5){dailyRun=true;dailyChallenge=getDailyChallenge();score=0;lives=currentLifeMax();stage=1;beginGame('daily');}
else if(menuCursor===6){showRecords=true;}
else{showHelp=true;}
}
}
}
document.addEventListener('keydown',e=>{
keys[e.key]=true;
if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
handleInputPress(e.key);
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
function bindTouch(id, keyStr, pressKey) {
const el = document.getElementById(id);
if(!el) return;
el.addEventListener('touchstart', e => {
e.preventDefault();
keys[keyStr] = true;
el.classList.add('pressed');
handleInputPress(pressKey||keyStr);
}, { passive: false });
el.addEventListener('touchend', e => {
e.preventDefault();
keys[keyStr] = false;
el.classList.remove('pressed');
}, { passive: false });
el.addEventListener('touchcancel', e => {
keys[keyStr] = false;
el.classList.remove('pressed');
}, { passive: false });
}
bindTouch('btn-up', 'ArrowUp');
bindTouch('btn-down', 'ArrowDown');
bindTouch('btn-left', 'ArrowLeft');
bindTouch('btn-right', 'ArrowRight');
bindTouch('btn-jump', 'ArrowUp', 'Jump');
bindTouch('btn-shoot', 'j');
const btnPause=document.getElementById('btn-pause');
if(btnPause){
btnPause.addEventListener('touchstart',e=>{e.preventDefault();handleInputPress('p');},{passive:false});
btnPause.addEventListener('click',e=>{e.preventDefault();handleInputPress('p');});
}
async function beginGame(loadSave){
normalizeProfile();
dailyRun=loadSave==='daily';dailyChallenge=dailyRun?getDailyChallenge():dailyChallenge;
if(raf)cancelAnimationFrame(raf);
getAC();
showMenu=false;showGameOver=false;gameOver=false;stageResult=false;
running=true;paused=false;pauseDiv.style.display='none';
camShake=0;deathFlash=0;stageCountdown=0;mobileStepAcc=0;
startBGM(false);
player=mkPlayer();
if(loadSave&&loadSave!== 'daily')await loadProgress();
else{score=0;lives=currentLifeMax();stage=1;upgrades={bulletSpd:0,dmgBoost:0,healRate:0,shield:profile.shield>0?1:0,coinBoost:profile.coinBoost>0?1:0};normalizeProfile();profile.records.runs=(profile.records.runs||0)+1;saveProfile();if(profile.shield>0){profile.shield--;saveProfile();}if(profile.coinBoost>0){profile.coinBoost--;saveProfile();}}
lives=Math.min(lives,currentLifeMax());
if(profile.startLaser>0){profile.startLaser--;player.gunType=3;player.gunLevel=2;player.gunTimer=GUN_MAX_TIMER;saveProfile();}
else if(profile.starterSpread>0){profile.starterSpread--;player.gunType=1;player.gunLevel=1;player.gunTimer=GUN_MAX_TIMER;saveProfile();}
mkStars();mkStage(stage);updateHUD();
beginStageCountdown(getStageTitle(stage));
updateControlLabels();
raf=requestAnimationFrame(loop);
}
sb.addEventListener('click',()=>{
getAC();stopBGM();
if(showGameOver){score=0;lives=currentLifeMax();stage=1;beginGame(false);return;}
showMenu=true;running=false;stageCountdown=0;
if(raf)cancelAnimationFrame(raf);
updateControlLabels();
raf=requestAnimationFrame(loop);
});
updateControlLabels();
raf=requestAnimationFrame(loop);
</script></body></html>
